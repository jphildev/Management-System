<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · Mini Management System</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="signed-out">

  <main>
    <section class="view auth-view">
      <p class="auth-brand">Mini Management</p>
      <div class="card auth-card">
        <h1>Log in</h1>
        <p class="sub">Welcome back. Enter your details to continue.</p>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label for="login-username">Username</label>
            <input id="login-username" name="username" type="text" required autocomplete="username" />
            <p class="field-error" id="login-username-error"></p>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" required autocomplete="current-password" />
            <p class="field-error" id="login-password-error"></p>
          </div>

          <button class="btn block" type="submit">Log in</button>
        </form>

        <p class="switch">No account yet? <a href="register.html">Register</a></p>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
